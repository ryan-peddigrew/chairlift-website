# Live data for the morning paper sample on /morning-paper/
[functions]
  directory = "netlify/functions"

# Speed (3 Nov 2026): photos, video and the 3D logo bundle are kept by browsers for a day,
# then quietly refreshed in the background, so repeat visits load almost nothing.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Credit saving (24 Nov 2026): only the main branch builds on Netlify, so pull request
# previews and other branches skip the build. Git still holds every change.
[build]
  ignore = "if [ \"$BRANCH\" = \"main\" ]; then exit 1; else exit 0; fi"
